[project]
name = "spiderlang"
version = "3.0.0"
description = "SpiderLang — one language, every Android device. Native recovery build DSL, universal FFI."
authors = [{name="Beru"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
spider = "spider.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
